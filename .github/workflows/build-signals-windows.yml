name: Build Signals EXE

# Builds ORB-Signals.exe on a Windows runner and uploads it as a downloadable
# artifact, so no Windows machine is needed to get one. Actions tab → Run workflow.
on:
  workflow_dispatch:
  push:
    tags: ["signals-v*"]
    branches: ["claude/autobot-orb-strategy-trader-w37cot"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than 3.13: MetaTrader5 does not always have a wheel for
          # the newest Python, and a build without it produces an exe that opens
          # and cannot read prices.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PySide6 pyinstaller
          pip install MetaTrader5

      - name: Confirm MetaTrader5 is importable
        run: python -c "import MetaTrader5; print('MetaTrader5', MetaTrader5.__version__)"

      - name: Run tests
        run: |
          pip install pytest
          pytest -q tests/test_markets_signals.py tests/test_markets_signal_settings.py tests/test_markets_orb.py tests/test_markets_clock.py

      - name: Build executable
        run: pyinstaller packaging/Signals.spec --noconfirm

      - name: Confirm the build contains no order path
        # The safety claim is meant to be a property of the binary, not a
        # promise: the trading modules are excluded in the spec, so their
        # absence is worth asserting rather than assuming.
        shell: pwsh
        run: |
          $hits = Select-String -Path dist\ORB-Signals.exe -Pattern 'order_send' -Encoding Byte -ErrorAction SilentlyContinue
          if ($hits) { Write-Error "the signals build contains order_send"; exit 1 }
          Write-Host "no order_send in the binary"

      - name: Show build output
        run: dir dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORB-Signals-windows
          path: dist/ORB-Signals.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/signals-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORB-Signals.exe
