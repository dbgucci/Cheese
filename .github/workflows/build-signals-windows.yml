name: Build Signals EXE

# Builds ORB-Signals.exe on a Windows runner and uploads it as a downloadable
# artifact, so no Windows machine is needed to get one. Actions tab → Run workflow.
on:
  workflow_dispatch:
  push:
    tags: ["signals-v*"]
    branches: ["claude/autobot-orb-strategy-trader-w37cot"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than 3.13: MetaTrader5 does not always have a wheel for
          # the newest Python, and a build without it produces an exe that opens
          # and cannot read prices.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PySide6 pyinstaller
          pip install MetaTrader5

      - name: Confirm MetaTrader5 is importable
        run: python -c "import MetaTrader5; print('MetaTrader5', MetaTrader5.__version__)"

      - name: Run tests
        run: |
          pip install pytest
          pytest -q tests/test_markets_signals.py tests/test_markets_signal_settings.py tests/test_markets_orb.py tests/test_markets_clock.py tests/test_gui_signals_layout.py

      - name: Render the pages to PNGs
        # The first build's Settings page was unusable and every test passed: a
        # missing scroll area, controls at the far right edge, a clipped brand
        # mark. tests/test_gui_signals_layout now asserts those specific
        # properties, but a test only catches a defect someone thought of first.
        # Shipping pictures with each build means the next one is visible without
        # a Windows machine or an install.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/render_signals_pages.py screenshots

      - name: Build executable
        run: pyinstaller packaging/Signals.spec --noconfirm

      - name: Confirm the build contains no order path
        # The safety claim is a property of the binary, not a promise. This
        # already earned its keep: it failed the first build, correctly, because
        # MT5Trader shared a module with the feed the app needs and was shipped
        # despite the exclusions. Splitting the modules is what fixed it.
        run: >-
          python -c "import sys;
          data = open('dist/ORB-Signals.exe','rb').read();
          needles = [b'order_send', b'TRADE_ACTION_DEAL'];
          found = [n.decode() for n in needles if n in data];
          print('order-placing symbols found:', found or 'none');
          sys.exit(1 if found else 0)"

      - name: Show build output
        run: dir dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORB-Signals-windows
          path: dist/ORB-Signals.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORB-Signals-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/signals-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORB-Signals.exe
