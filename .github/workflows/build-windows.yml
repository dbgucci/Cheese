name: Build Windows EXE

# Builds the standalone CheeseSignals.exe on a Windows runner and uploads it
# as a downloadable artifact. Run it from the Actions tab ("Run workflow"),
# or push a v* tag to also attach the exe to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/pocket-option-signals-bot-t2pxi7"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PySide6 pyinstaller
          # Must be present at build time: a frozen exe cannot load packages
          # installed on the user's machine afterwards.
          pip install binaryoptionstoolsv2

      - name: Run tests
        run: |
          pip install pytest
          pytest -q

      - name: Build executable
        run: pyinstaller packaging/CheeseSignals.spec --noconfirm

      - name: Show build output
        run: dir dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheeseSignals-windows
          path: dist/CheeseSignals.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CheeseSignals.exe
