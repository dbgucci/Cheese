[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheese-signals"
version = "0.1.0"
description = "Multi-timeframe confluence signal engine for short-timeframe trading"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
cheese-signals = "cheese_signals.bot:main"

[project.gui-scripts]
cheese-signals-app = "cheese_signals.gui:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
# The analysis package needs a statistics library. Kept optional rather than
# required because the shipped executables never run it -- bundling scipy
# into them would add tens of megabytes for code that only ever runs on a
# desk, offline, against a recorded database.
research = ["scipy>=1.11"]
live = ["binaryoptionstoolsv2>=0.1"]
build = ["pyinstaller>=6.3"]

[tool.setuptools.packages.find]
where = ["src"]
